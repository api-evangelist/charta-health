aid: charta-health
name: Charta Health
description: 'Charta Health is a healthcare AI company (founded 2023) that provides
  AI-powered medical chart review and autonomous coding for provider groups, FQHCs,
  MSOs, health systems, and payers. Its platform streams charts in from hundreds of
  EHR, clearinghouse, and billing integrations, then audits every patient encounter
  pre-billing to generate codes, surface missed revenue and E/M leveling issues, identify
  HCC risk-adjustment codes with supporting documentation citations, reduce payer
  audit risk, and deliver data-driven provider feedback. Charta reports outcomes such
  as an 11% revenue uplift from scaling pre-billing review across 100% of encounters.
  Integrations are built per customer against the customer''s EHR (e.g. athenahealth
  Marketplace); Charta does not publish a public self-serve developer API or portal.'
